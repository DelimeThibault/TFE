<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>Vélo connecté - Temps réel local</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body>
  <main class="container">
    <h1>Vélo connecté - Temps réel local</h1>

    <section class="card">
      <div class="row">
        <div>
          <div class="label">Statut</div>
          <div id="status-badge" class="badge err">Déconnecté</div>
        </div>
        <div>
          <div class="label">Session</div>
          <div id="session-id">--</div>
        </div>
      </div>

      <div class="grid">
        <div><span class="label">Cadence</span><span id="cadence">--</span></div>
        <div><span class="label">Vitesse</span><span id="speed">--</span></div>
        <div><span class="label">Puissance</span><span id="power">--</span></div>
        <div><span class="label">Résistance</span><span id="resistance">--</span></div>
        <div><span class="label">Énergie</span><span id="energy">--</span></div>
        <div><span class="label">État</span><span id="system-state">--</span></div>
      </div>
    </section>

    <section class="card">
      <h2>Latence</h2>
      <div class="grid">
        <div><span class="label">Capteur → App</span><span id="lat-app">--</span></div>
        <div><span class="label">Bout en bout</span><span id="lat-e2e">--</span></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
