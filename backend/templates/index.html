<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vélo connecté — Dashboard</title>
  <script src="/static/socket.io.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }

    [data-theme="light"] body {
      background: #f5f5f2;
      color: #1a1a1a;
    }

    [data-theme="light"] nav {
      background: #ffffff;
      border-color: #e0ddd8;
    }

    [data-theme="light"] .panel,
    [data-theme="light"] .energy-equivalents {
      background: #ffffff;
      border-color: #e0ddd8;
    }

    [data-theme="light"] .panel-header,
    [data-theme="light"] .metric-cell,
    [data-theme="light"] .energy-total-box,
    [data-theme="light"] .equivalent-card {
      border-color: #e0ddd8;
    }

    [data-theme="light"] .metric-value {
      color: #1a1a1a;
    }

    [data-theme="light"] .energy-total-box,
    [data-theme="light"] .equivalent-card {
      background: #fcfcfb;
    }

    [data-theme="light"] .equivalent-meta,
    [data-theme="light"] .equivalent-status,
    [data-theme="light"] .energy-total-box span,
    [data-theme="light"] .metric-unit,
    [data-theme="light"] .metric-label,
    [data-theme="light"] .panel-header,
    [data-theme="light"] .conn-area,
    [data-theme="light"] #conn-label {
      color: #6b7280;
    }

    [data-theme="light"] .equivalent-progress {
      background: #ece8e2;
    }

    [data-theme="light"] .equivalent-card.done {
      border-color: rgba(67, 122, 34, 0.45);
      box-shadow: 0 0 0 1px rgba(67, 122, 34, 0.08);
    }

    [data-theme="light"] .equivalent-card.done .equivalent-status {
      color: #2e6b16;
    }

    [data-theme="light"] .playpause-btn {
      background: #ecfdf3;
      border-color: #b7e4c7;
      color: #166534;
      box-shadow: 0 6px 18px rgba(22, 101, 52, 0.12);
    }

    [data-theme="light"] .playpause-btn:hover {
      background: #dcfce7;
      border-color: #86d3a3;
    }

    [data-theme="light"] .playpause-btn.paused {
      background: #eff6ff;
      border-color: #bfd7ff;
      color: #1d4ed8;
      box-shadow: 0 6px 18px rgba(29, 78, 216, 0.12);
    }

    [data-theme="light"] .playpause-btn.paused:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    nav {
      background: #1a1d27;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      border-bottom: 1px solid #2a2d3a;
      height: 52px;
    }

    nav .logo {
      font-weight: 700;
      font-size: 1rem;
      color: #4f98a3;
      letter-spacing: 0.05em;
    }

    nav a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
      transition: color 180ms, border-color 180ms;
    }

    nav a:hover { color: #e0e0e0; }

    nav a.active {
      color: #4f98a3;
      border-bottom-color: #4f98a3;
    }

    .conn-area {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #6b7280;
    }

    #conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dd6974;
      transition: background 300ms;
    }

    #conn-dot.connected { background: #6daa45; }

    .theme-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      padding: 0.25rem;
      margin-left: 0.25rem;
      display: flex;
      align-items: center;
      transition: color 180ms;
    }

    .theme-btn:hover { color: #e0e0e0; }

    .main {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .panel {
      background: #1a1d27;
      border-radius: 0.75rem;
      border: 1px solid #2a2d3a;
      overflow: hidden;
    }

    .panel-header {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #2a2d3a;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .playpause-btn,
    .reset-btn {
      border-radius: 0.65rem;
      padding: 0.65rem 1rem;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 180ms ease;
    }

    .playpause-btn {
      border: 1px solid #1f7a52;
      background: #15803d;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(21, 128, 61, 0.25);
    }

    .playpause-btn:hover {
      background: #166534;
      border-color: #14532d;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(21, 128, 61, 0.32);
    }

    .playpause-btn.paused {
      border-color: #2563eb;
      background: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(29, 78, 216, 0.25);
    }

    .playpause-btn.paused:hover {
      background: #1e40af;
      border-color: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(29, 78, 216, 0.32);
    }

    .playpause-btn:active,
    .reset-btn:active { transform: translateY(0); }

    .playpause-btn:disabled,
    .reset-btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .reset-btn {
      border: 1px solid #b42318;
      background: #d92d20;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(217, 45, 32, 0.25);
    }

    .reset-btn:hover {
      background: #b42318;
      border-color: #912018;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(180, 35, 24, 0.32);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
    }

    .metric-cell {
      padding: 1.7rem 1.6rem;
      border-right: 1px solid #2a2d3a;
      border-bottom: 1px solid #2a2d3a;
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metric-cell:nth-child(2n) { border-right: none; }
    .metric-cell:nth-last-child(-n+2) { border-bottom: none; }

    .metric-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-bottom: 0.45rem;
    }

    .metric-value {
      font-size: 2.45rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #e0e0e0;
    }

    .metric-unit {
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 0.35rem;
    }

    .metric-cell.highlight .metric-value { color: #4f98a3; }

    #resistance {
      font-size: 2.2rem;
    }

    .energy-equivalents {
      margin-top: 4px;
      padding: 1.25rem;
      background: #1a1d27;
      border-radius: 0.75rem;
      border: 1px solid #2a2d3a;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.1rem;
      color: inherit;
    }

    .energy-total-box {
      min-width: 180px;
      padding: 0.8rem 0.95rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2a2d3a;
      text-align: right;
    }

    .energy-total-box span {
      display: block;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .energy-total-box strong {
      font-size: 1.35rem;
      font-variant-numeric: tabular-nums;
      color: inherit;
    }

    .equivalents-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .equivalent-card {
      position: relative;
      padding: 1rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #2a2d3a;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .equivalent-card:hover {
      transform: translateY(-2px);
      border-color: #3a4151;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .equivalent-card.done {
      border-color: rgba(109, 170, 69, 0.5);
      box-shadow: 0 0 0 1px rgba(109, 170, 69, 0.12);
    }

    .equivalent-top {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.55rem;
    }

    .equivalent-icon {
      font-size: 1.8rem;
      line-height: 1;
    }

    .equivalent-card h3 {
      font-size: 1rem;
      margin: 0;
    }

    .equivalent-meta {
      font-size: 1rem;
      font-weight: 700;
      color: #4f98a3;
      margin-bottom: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .equivalent-progress {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .equivalent-progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4f98a3 0%, #6bbbc6 100%);
      transition: width 350ms ease;
    }

    .equivalent-card.done .equivalent-progress-bar {
      background: linear-gradient(90deg, #6daa45 0%, #8ad85f 100%);
    }

    .equivalent-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      margin-bottom: 0.45rem;
      font-variant-numeric: tabular-nums;
    }

    .equivalent-stats strong { color: #4f98a3; }
    .equivalent-card.done .equivalent-stats strong { color: #8ad85f; }

    .equivalent-status {
      font-size: 0.84rem;
      color: #9ca3af;
      min-height: 2.6rem;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .equivalent-status span { display: block; }

    .equivalent-card.done .equivalent-status {
      color: #8ad85f;
      font-weight: 600;
    }

    @media (max-width: 980px) {
      .equivalents-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 700px) {
      .metrics-grid { grid-template-columns: 1fr; }

      .metric-cell {
        border-right: none !important;
        border-bottom: 1px solid #2a2d3a !important;
        min-height: 125px;
      }

      .metric-cell:last-child { border-bottom: none !important; }
      .metric-value { font-size: 2.2rem; }

      .section-head { flex-direction: column; }

      .energy-total-box {
        width: 100%;
        text-align: left;
      }

      .equivalents-grid { grid-template-columns: 1fr; }

      .panel-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <nav>
    <span class="logo">🚴 Vélo LLN</span>
    <a href="/" class="active">Dashboard</a>
    <a href="/parcours">Parcours 24h</a>
    <a href="/entrainements">Entrainements</a>

    <div class="conn-area">
      <span id="conn-dot"></span>
      <span id="conn-label">Déconnecté</span>
      <button class="theme-btn" data-theme-toggle aria-label="Passer en mode sombre">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </nav>

  <div class="main">
    <div class="panel">
      <div class="panel-header">
        <span>Métriques temps réel</span>
        <div class="panel-actions">
          <button
            id="pausePlayBtn"
            class="playpause-btn"
            type="button"
            aria-pressed="false"
            aria-label="Démarrer la session">
            ▶ Play
          </button>
          <button id="resetSessionBtn" class="reset-btn" type="button">Reset session</button>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-cell">
          <div class="metric-label">Durée</div>
          <div class="metric-value" id="duration">00:00</div>
          <div class="metric-unit">session</div>
        </div>

        <div class="metric-cell">
          <div class="metric-label">Distance parcourue</div>
          <div class="metric-value" id="distance">--</div>
          <div class="metric-unit">km</div>
        </div>

        <div class="metric-cell highlight">
          <div class="metric-label">Cadence</div>
          <div class="metric-value" id="cadence">--</div>
          <div class="metric-unit">RPM</div>
        </div>

        <div class="metric-cell">
          <div class="metric-label">Vitesse simulée</div>
          <div class="metric-value" id="speed">--</div>
          <div class="metric-unit">km/h</div>
        </div>

        <div class="metric-cell">
          <div class="metric-label">Puissance</div>
          <div class="metric-value" id="power">--</div>
          <div class="metric-unit">W</div>
        </div>

        <div class="metric-cell">
          <div class="metric-label">Vitesse</div>
          <div class="metric-value" id="resistance">--</div>
          <div class="metric-unit">niveau / 8</div>
        </div>
      </div>
    </div>

    <section class="energy-equivalents">
      <div class="section-head">
        <h2>Équivalences du quotidien</h2>
        <div class="energy-total-box">
          <span>Production session</span>
          <strong id="energySessionValue">-- Wh</strong>
        </div>
      </div>
      <div class="equivalents-grid" id="equivalentsGrid"></div>
    </section>
  </div>

  <script>
    const socket = io();
    const THEME_KEY = 'velo-theme';

    const ENERGY_EQUIVALENTS = [
      { key: "led", name: "Ampoule LED", icon: "💡", targetWh: 5 },
      { key: "phone", name: "Recharge smartphone", icon: "📱", targetWh: 20 },
      { key: "toaster", name: "Grille-pain", icon: "🍞", targetWh: 170 },
      { key: "washer", name: "Machine à laver", icon: "🧺", targetWh: 900 }
    ];

    let sessionState = 'stopped';
    let sessionHasStarted = false;
    let isActionLoading = false;
    let currentPowerW = 0;
    let lastSessionDurationSeconds = 0;

    let chronoBaseSeconds = 0;
    let chronoServerSyncMs = 0;
    let chronoRunning = false;
    let chronoInterval = null;

    function formatWh(value) {
      return `${Number(value || 0).toFixed(1)} Wh`;
    }

    function formatMinutes(minutes) {
      if (!isFinite(minutes) || minutes <= 0) return "-- min";
      if (minutes < 1) return "< 1 min";
      if (minutes < 60) return `${Math.ceil(minutes)} min`;
      const h = Math.floor(minutes / 60);
      const m = Math.ceil(minutes % 60);
      return m === 60 ? `${h + 1} h` : `${h} h ${m} min`;
    }

    function formatSessionDuration(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds || 0));
      const hours = Math.floor(sec / 3600);
      const minutes = Math.floor((sec % 3600) / 60);
      const seconds = sec % 60;

      if (hours > 0) {
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getRemainingTimeMinutes(remainingWh, powerW) {
      if (!powerW || powerW <= 0) return Infinity;
      return (remainingWh / powerW) * 60;
    }

    function formatResistanceLevel(resistanceV) {
      if (resistanceV == null || Number.isNaN(Number(resistanceV))) return '--';

      const minV = 0.4;
      const maxV = 1.1;
      const steps = 8;
      const value = Number(resistanceV);
      const index = Math.round((value - minV) / 0.1) + 1;
      const clamped = Math.min(steps, Math.max(1, index));

      return `Vitesse ${clamped} / ${steps}`;
    }

    function getDisplayedChronoSeconds() {
      if (!chronoRunning) {
        return chronoBaseSeconds;
      }

      const elapsedSinceSync = Math.floor((Date.now() - chronoServerSyncMs) / 1000);
      return Math.max(0, chronoBaseSeconds + elapsedSinceSync);
    }

    function renderChrono() {
      document.getElementById('duration').textContent =
        formatSessionDuration(getDisplayedChronoSeconds());
    }

    function startChronoTicker() {
      if (chronoInterval) return;
      chronoInterval = setInterval(renderChrono, 250);
    }

    function stopChronoTicker() {
      if (!chronoInterval) return;
      clearInterval(chronoInterval);
      chronoInterval = null;
    }

    function syncChrono(serverSeconds, running) {
      chronoBaseSeconds = Math.max(0, Math.floor(serverSeconds || 0));
      chronoServerSyncMs = Date.now();
      chronoRunning = Boolean(running);

      renderChrono();

      if (chronoRunning) {
        startChronoTicker();
      } else {
        stopChronoTicker();
      }
    }

    function resetChrono() {
      chronoBaseSeconds = 0;
      chronoServerSyncMs = Date.now();
      chronoRunning = false;
      stopChronoTicker();
      renderChrono();
      lastSessionDurationSeconds = 0;
    }

    function setSessionStateUI(state) {
      sessionState = state;
      const btn = document.getElementById('pausePlayBtn');
      if (!btn) return;

      btn.classList.remove('paused');

      if (state === 'stopped') {
        btn.textContent = '▶ Play';
        btn.setAttribute('aria-label', 'Démarrer la session');
        btn.setAttribute('aria-pressed', 'false');
      } else if (state === 'running') {
        btn.textContent = '⏸ Pause';
        btn.classList.add('paused');
        btn.setAttribute('aria-label', 'Mettre en pause la session');
        btn.setAttribute('aria-pressed', 'true');
      } else if (state === 'paused') {
        btn.textContent = '▶ Reprendre';
        btn.setAttribute('aria-label', 'Reprendre la session');
        btn.setAttribute('aria-pressed', 'false');
      }
    }

    function setButtonsLoading(loading) {
      isActionLoading = Boolean(loading);
      const pauseBtn = document.getElementById('pausePlayBtn');
      const resetBtn = document.getElementById('resetSessionBtn');
      if (pauseBtn) pauseBtn.disabled = isActionLoading;
      if (resetBtn) resetBtn.disabled = isActionLoading;
    }

    async function startSession() {
      const response = await fetch('/api/session/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) {
        throw new Error('Impossible de démarrer la session');
      }

      return response.json();
    }

    async function pauseSession() {
      const response = await fetch('/api/session/pause', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) {
        throw new Error('Impossible de mettre en pause la session');
      }

      return response.json();
    }

    async function resumeSession() {
      const response = await fetch('/api/session/resume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) {
        throw new Error('Impossible de reprendre la session');
      }

      return response.json();
    }

    async function fetchInitialSessionState() {
      const response = await fetch('/api/session');
      if (!response.ok) {
        throw new Error('Impossible de charger l’état initial de session');
      }
      return response.json();
    }

    async function togglePausePlay() {
      if (isActionLoading) return;

      setButtonsLoading(true);
      try {
        if (sessionState === 'stopped') {
          await startSession();
        } else if (sessionState === 'running') {
          await pauseSession();
        } else if (sessionState === 'paused') {
          await resumeSession();
        }
      } catch (error) {
        console.error('Erreur pause/play dashboard:', error);
      } finally {
        setButtonsLoading(false);
      }
    }

    async function resetSession() {
      if (isActionLoading) return;

      setButtonsLoading(true);
      try {
        const response = await fetch('/api/dashboard/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) {
          throw new Error('Impossible de reset la session');
        }

        resetChrono();
        sessionHasStarted = false;
        renderEnergyEquivalents(0, 0, false);
        document.getElementById('distance').textContent = '--';
        setSessionStateUI('stopped');
      } catch (error) {
        console.error('Erreur reset dashboard:', error);
      } finally {
        setButtonsLoading(false);
      }
    }

    function renderEnergyEquivalents(energyWh = 0, powerW = 0, showValues = true) {
      const totalEl = document.getElementById('energySessionValue');
      const gridEl = document.getElementById('equivalentsGrid');
      if (!totalEl || !gridEl) return;

      const safeEnergy = Number(energyWh || 0);
      const safePower = Number(powerW || 0);
      const displayEnergy = showValues ? safeEnergy : 0;
      totalEl.textContent = formatWh(displayEnergy);

      gridEl.innerHTML = ENERGY_EQUIVALENTS.map((item) => {
        const progress = showValues ? Math.min((safeEnergy / item.targetWh) * 100, 100) : 0;
        const done = showValues ? safeEnergy >= item.targetWh : false;
        const currentWhLabel = showValues ? formatWh(Math.min(safeEnergy, item.targetWh)) : formatWh(0);
        const remainingWh = showValues ? Math.max(item.targetWh - safeEnergy, 0) : item.targetWh;
        const remainingMinutes = showValues ? getRemainingTimeMinutes(remainingWh, safePower) : Infinity;
        const remainingTimeLabel = showValues ? formatMinutes(remainingMinutes) : '-- min';

        return `
          <article class="equivalent-card ${done ? 'done' : ''}">
            <div class="equivalent-top">
              <div class="equivalent-icon">${item.icon}</div>
              <h3>${item.name}</h3>
            </div>
            <div class="equivalent-meta">${formatWh(item.targetWh)}</div>
            <div class="equivalent-progress">
              <div class="equivalent-progress-bar" style="width: ${progress}%;"></div>
            </div>
            <div class="equivalent-stats">
              <span>${currentWhLabel} / ${formatWh(item.targetWh)}</span>
              <strong>${Math.round(progress)}%</strong>
            </div>
            <div class="equivalent-status">
              ${done
                ? 'Objectif atteint'
                : `<span>~ ${remainingTimeLabel} au rythme actuel</span>`}
            </div>
          </article>`;
      }).join('');
    }

    function updateMetrics(data, fullState = null) {
      const shouldShowValues = Boolean(
        fullState?.session_running ||
        (fullState?.session_duration_s ?? 0) > 0 ||
        sessionHasStarted
      );
      sessionHasStarted = shouldShowValues;

      const liveData = shouldShowValues ? (data || fullState?.last_realtime || {}) : null;
      const cadence = liveData?.cadence_rpm != null ? Math.round(liveData.cadence_rpm) : '--';
      const speedDisplay = liveData?.speed_sim_kmh != null ? Number(liveData.speed_sim_kmh).toFixed(1) : '--';
      const powerValue = liveData?.power_w != null ? Number(liveData.power_w) : 0;
      const powerDisplay = liveData?.power_w != null ? Math.round(liveData.power_w) : '--';
      const resistanceDisplay = shouldShowValues ? formatResistanceLevel(liveData?.resistance_v) : '--';
      const energySessionWh = shouldShowValues ? (fullState?.energy_session_wh ?? fullState?.last_realtime?.energy_session_wh ?? liveData?.energy_session_wh ?? 0) : 0;
      const distanceSessionM = shouldShowValues ? (fullState?.distance_session_m ?? liveData?.distance_session_m ?? 0) : 0;

      document.getElementById('cadence').textContent = cadence;
      document.getElementById('speed').textContent = speedDisplay;
      document.getElementById('power').textContent = powerDisplay;
      document.getElementById('resistance').textContent = resistanceDisplay;
      document.getElementById('distance').textContent = shouldShowValues ? (Number(distanceSessionM || 0) / 1000).toFixed(2) : '--';

      currentPowerW = powerValue;
      renderEnergyEquivalents(Number(energySessionWh || 0), currentPowerW, shouldShowValues);

      if (fullState?.session_duration_s != null) {
        const isRunning = Boolean(fullState?.session_running);
        const incomingSeconds = Math.max(0, Math.floor(fullState.session_duration_s || 0));

        if (isRunning || incomingSeconds > 0) {
          lastSessionDurationSeconds = incomingSeconds;
        }

        const chronoSeconds = isRunning
          ? lastSessionDurationSeconds
          : (incomingSeconds > 0 ? incomingSeconds : lastSessionDurationSeconds);

        syncChrono(chronoSeconds, isRunning);

        if (fullState.session_duration_s <= 0 && isRunning) {
          setSessionStateUI('running');
        } else if (fullState.session_duration_s <= 0 && !isRunning) {
          setSessionStateUI('stopped');
        } else if (isRunning) {
          setSessionStateUI('running');
        } else {
          setSessionStateUI('paused');
        }
      }
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      const btn = document.querySelector('[data-theme-toggle]');
      html.setAttribute('data-theme', theme);

      const moonSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      const sunSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;

      if (btn) {
        btn.innerHTML = theme === 'dark' ? sunSVG : moonSVG;
        btn.setAttribute('aria-label', theme === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre');
      }
    }

    function initTheme() {
      let savedTheme = 'light';
      try {
        savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      } catch (e) {}
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch (e) {}
    }

    socket.on('connect', () => {
      document.getElementById('conn-dot').classList.add('connected');
      document.getElementById('conn-label').textContent = 'Connecté';
    });

    socket.on('disconnect', () => {
      document.getElementById('conn-dot').classList.remove('connected');
      document.getElementById('conn-label').textContent = 'Déconnecté';
    });

    let lastFullState = null;

    socket.on('realtime_update', (data) => {
      if (lastFullState) {
        lastFullState.last_realtime = { ...lastFullState.last_realtime, ...data };
        updateMetrics(data, lastFullState);
      } else {
        updateMetrics(data, null);
      }
    });

    socket.on('session_snapshot', (state) => {
      lastFullState = state;
      const realtime = state?.last_realtime || {};
      updateMetrics(realtime, state);
    });

    socket.on('dashboard_reset', (state) => {
      lastFullState = state;
      const realtime = state?.last_realtime || {};
      updateMetrics(realtime, state);
      resetChrono();
      setSessionStateUI('stopped');
    });

    document.getElementById('pausePlayBtn').addEventListener('click', togglePausePlay);
    document.getElementById('resetSessionBtn').addEventListener('click', resetSession);
    document.querySelector('[data-theme-toggle]').addEventListener('click', toggleTheme);

    initTheme();
    renderEnergyEquivalents(0, 0, false);
    resetChrono();
    setSessionStateUI('stopped');

    fetchInitialSessionState()
      .then((state) => {
        const realtime = state?.last_realtime || {};
        sessionHasStarted = Boolean(state?.session_running || (state?.session_duration_s ?? 0) > 0);
        updateMetrics(realtime, state);
      })
      .catch((error) => {
        console.error('Erreur chargement état initial:', error);
      });
  </script>
</body>

</html>
