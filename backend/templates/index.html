<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Compteur vélo temps réel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f5f5; }
    h1 { margin-bottom: 0.5rem; }
    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 420px;
    }
    .value { font-size: 2.8rem; font-weight: 700; }
    .label { color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .row { display: flex; justify-content: space-between; margin-top: 0.8rem; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; }
    .badge.ok { background: #e6ffed; color: #137333; }
    .badge.err { background: #ffebee; color: #b71c1c; }
    .small { font-size: 0.8rem; color: #777; }
  </style>

  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<h1>🚴 Compteur vélo temps réel</h1>
<p>Flux en direct depuis le Pico via API Flask + WebSocket.</p>

<div class="card">
  <div class="row" style="align-items: baseline;">
    <div>
      <div class="label">Cadence actuelle</div>
      <div class="value" id="cadence">--</div>
    </div>
    <span id="status" class="badge err">Déconnecté</span>
  </div>

  <div class="row">
    <div>
      <div class="label">Total pulses</div>
      <div id="total_pulses">--</div>
    </div>
    <div>
      <div class="label">Dernière mesure</div>
      <div class="small" id="created_at">--</div>
    </div>
  </div>

  <div class="row">
    <div>
      <div class="label">Timestamp capteur (ms)</div>
      <div class="small" id="sensor_ts_ms">--</div>
    </div>
    <div>
      <div class="label">Timestamp passerelle</div>
      <div class="small" id="gateway_ts">--</div>
    </div>
  </div>
</div>

<script>
  console.log("JS chargé");

  // Récupère les éléments du DOM
  const cadenceEl = document.getElementById("cadence");
  const totalEl = document.getElementById("total_pulses");
  const createdEl = document.getElementById("created_at");
  const sensorEl = document.getElementById("sensor_ts_ms");
  const gatewayEl = document.getElementById("gateway_ts");

  console.log("Éléments:", { cadenceEl, totalEl, createdEl, sensorEl, gatewayEl });

  function setStatus(connected) {
    const statusEl = document.getElementById("status");
    if (statusEl) {
      statusEl.textContent = connected ? "Connecté" : "Déconnecté";
      statusEl.className = connected ? "badge ok" : "badge err";
    }
  }

  // Connexion Socket.IO vers le même host que la page
  const socket = io({
    transports: ["websocket", "polling"],
    timeout: 10000,
  });

  socket.on("connect", () => {
    console.log("✅ SocketIO connecté");
    setStatus(true);
  });

  socket.on("disconnect", () => {
    console.log("🔌 SocketIO déconnecté");
    setStatus(false);
  });

  socket.on("connect_error", (err) => {
    console.error("❌ SocketIO erreur:", err);
    setStatus(false);
  });

  // Réception des mises à jour de cadence
  socket.on("cadence_update", (data) => {
    console.log("📊 Cadence update:", data);

    if (cadenceEl) cadenceEl.textContent = data.cadence ?? "--";
    if (totalEl)   totalEl.textContent   = data.total_pulses ?? "--";
    if (createdEl) createdEl.textContent = data.created_at ?? "--";
    if (sensorEl)  sensorEl.textContent  = data.sensor_ts_ms ?? "--";

    if (gatewayEl) {
      if (data.gateway_ts != null) {
        try {
          const v = Number(data.gateway_ts);
          gatewayEl.textContent = isNaN(v) ? data.gateway_ts : v.toFixed(3);
        } catch {
          gatewayEl.textContent = data.gateway_ts;
        }
      } else {
        gatewayEl.textContent = "--";
      }
    }
  });
</script>

</body>
</html>
